<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pedido Especial ✨</title>

<style>
:root{
  --bg1:#0c0c0c;
  --bg2:#1a1a1a;
  --gold1:#c6a84f;
  --gold2:#f5e6b3;
  --gold3:#8f6b1f;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Georgia', serif;
}

body{
  height:100vh;
  overflow:hidden;
  background:linear-gradient(135deg,var(--bg1),var(--bg2));
  display:flex;
  justify-content:center;
  align-items:center;
  color:white;
}

/* PARTÍCULAS DOURADAS */
.particulas span{
  position:absolute;
  width:3px;
  height:3px;
  background:radial-gradient(circle,var(--gold2),transparent);
  border-radius:50%;
  opacity:0.7;
  animation:subir linear infinite;
}

@keyframes subir{
  from{transform:translateY(100vh);}
  to{transform:translateY(-10vh);}
}

/* CORAÇÕES DOURADOS ATRÁS */
.coracao{
  position:absolute;
  color:rgba(212,175,55,0.6);
  font-size:20px;
  animation:flutuar linear infinite;
  text-shadow:0 0 15px rgba(212,175,55,0.8);
  z-index:0;
}

@keyframes flutuar{
  from{transform:translateY(100vh) scale(1);}
  to{transform:translateY(-10vh) scale(1.5);}
}

/* CARTA */
.card{
  position:relative;
  z-index:2;
  background:rgba(0,0,0,0.75);
  backdrop-filter:blur(15px);
  padding:55px;
  width:90%;
  max-width:650px;
  border-radius:30px;
  border:2px solid var(--gold1);
  box-shadow:
    0 0 40px rgba(198,168,79,0.6),
    0 20px 60px rgba(0,0,0,0.9);
  text-align:center;
  animation:entrar 1.5s ease;
}

@keyframes entrar{
  from{opacity:0; transform:translateY(70px) scale(0.9);}
  to{opacity:1; transform:translateY(0) scale(1);}
}

h1{
  margin-bottom:25px;
  font-size:26px;
  background:linear-gradient(90deg,var(--gold3),var(--gold2));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.texto{
  font-size:18px;
  min-height:120px;
  margin-bottom:25px;
  line-height:1.6;
}

/* BOTÕES */
button{
  padding:12px 28px;
  border:none;
  border-radius:30px;
  cursor:pointer;
  font-weight:bold;
  margin:10px;
  transition:0.3s;
}

.sim{
  background:linear-gradient(90deg,var(--gold3),var(--gold2));
  color:black;
}

.sim:hover{
  transform:scale(1.1);
}

.nao{
  background:#ffffff15;
  color:white;
  position:relative;
}

.final{
  font-size:22px;
  margin-top:20px;
  animation:fadeIn 1.5s ease forwards;
  opacity:0;
  background:linear-gradient(90deg,var(--gold3),var(--gold2));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

@keyframes fadeIn{
  to{opacity:1;}
}
</style>
</head>

<body>

<div class="particulas"></div>
<div id="coracoes"></div>

<div class="card">
  <h1>Tem algo muito especial para te perguntar ✨</h1>
  <div class="texto" id="texto"></div>
  <div id="botoes">
    <button id="continuar" onclick="proximaFrase()" class="sim">Continuar 💛</button>
  </div>
  <div id="finalMsg"></div>
</div>

<script>

/* PARTÍCULAS */
const particulas = document.querySelector(".particulas");
for(let i=0;i<70;i++){
  let span=document.createElement("span");
  span.style.left=Math.random()*100+"vw";
  span.style.animationDuration=(10+Math.random()*8)+"s";
  particulas.appendChild(span);
}

/* CORAÇÕES ATRÁS */
const areaCoracoes=document.getElementById("coracoes");
function gerarCoracao(){
  let heart=document.createElement("div");
  heart.classList.add("coracao");
  heart.innerHTML="❤";
  heart.style.left=Math.random()*100+"vw";
  heart.style.fontSize=(18+Math.random()*25)+"px";
  heart.style.animationDuration=(8+Math.random()*6)+"s";
  areaCoracoes.appendChild(heart);
  setTimeout(()=>heart.remove(),12000);
}
setInterval(gerarCoracao,900);

/* FRASES */
const frases=[
"Desde que você entrou na minha vida...",
"Tudo passou a brilhar diferente.",
"Cada momento ao seu lado é precioso.",
"E meu coração já fez a escolha dele..."
];

let index = 0;
let escrevendo = false;
const texto = document.getElementById("texto");
const continuarBtn = document.getElementById("continuar");
const botoes = document.getElementById("botoes");
const finalMsg = document.getElementById("finalMsg");

function digitarFrase(frase){
    escrevendo = true;
    texto.innerHTML = "";
    let char = 0;

    function escrever(){
        if(char < frase.length){
            texto.innerHTML += frase.charAt(char);
            char++;
            setTimeout(escrever, 35);
        } else {
            escrevendo = false;
        }
    }
    escrever();
}

function proximaFrase(){
    if(escrevendo) return;

    if(index < frases.length){
        digitarFrase(frases[index]);
        index++;
    } else {
        mostrarPedido();
    }
}

function mostrarPedido(){
    texto.innerHTML = "Você aceita namorar comigo? 💍✨";
    continuarBtn.style.display="none";

    botoes.innerHTML = `
        <button class="sim" onclick="aceitou()">SIM 💛</button>
        <button class="nao" onmouseover="fugir(this)">NÃO 😅</button>
    `;
}

function fugir(btn){
    btn.style.position="absolute";
    btn.style.top=Math.random()*200+"px";
    btn.style.left=Math.random()*200+"px";
}

function aceitou(){
    botoes.style.display="none";
    finalMsg.innerHTML="<div class='final'>Agora é oficial ✨💛<br>Você é minha namorada!</div>";
}

</script>

</body>
</html>
